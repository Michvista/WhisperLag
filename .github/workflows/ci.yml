name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @whisperlag/shared

      - name: Generate Prisma client
        run: npm run prisma:generate -w @whisperlag/api

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run unit tests (RBAC + services)
        run: npm test
        env:
          # Tests mock Prisma, so no DB is needed — just a valid-looking
          # DATABASE_URL for env.ts (which is gitignored, so CI has none).
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build API
        run: npm run prisma:generate -w @whisperlag/api && npm run build -w @whisperlag/api

      - name: Build Web
        run: npm run build -w @whisperlag/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"